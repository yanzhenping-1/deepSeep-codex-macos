name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: bash -n deepseek-codex-macos.sh tests/test.sh tests/fixtures/*.sh
      - name: Run isolated tests
        run: ./tests/test.sh
